<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人 AI 知识库</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 880px; margin: 32px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-top: 0; }
  .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; background: #fff; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 10px 18px; background: #2b6cb0; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #2c5282; }
  button:disabled { background: #999; cursor: not-allowed; }
  .del-btn { margin-left: 10px; padding: 2px 10px; background: #e53e3e; font-size: 12px; }
  .del-btn:hover { background: #c53030; }
  label { font-size: 13px; color: #555; font-weight: 600; }
  .file-list { font-size: 13px; color: #555; margin-top: 10px; line-height: 1.6; }
  .answer { background: #f7fafc; border-left: 3px solid #2b6cb0; padding: 12px 16px; border-radius: 4px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; }
  .msg { margin-top: 14px; }
  .q-bubble { background: #ebf4ff; border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.6; }
  .a-bubble { margin-top: 8px; }
  .sources { font-size: 12px; color: #666; margin-top: 14px; }
  .src-item { background: #fafafa; border: 1px solid #eee; padding: 8px 10px; margin-top: 6px; border-radius: 4px; }
  .toast { position: fixed; top: 20px; right: 20px; background: #2b6cb0; color: #fff; padding: 10px 16px; border-radius: 6px; display: none; font-size: 14px; }
  .empty { color: #999; }
  .fb-row { margin-top: 8px; display: flex; gap: 8px; }
  .fb-btn { padding: 4px 12px; font-size: 12px; background: #edf2f7; color: #2b6cb0; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; }
  .fb-btn:hover:not(:disabled) { background: #e2e8f0; }
  .fb-btn:disabled { color: #38a169; border-color: #9ae6b4; cursor: default; background: #f0fff4; }
  .fb-stat { font-size: 12px; color: #888; margin-left: 10px; }
  .copy-btn { margin-top: 8px; padding: 4px 12px; font-size: 12px; background: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; }
  .copy-btn:hover { background: #e2e8f0; }
  .md-body pre { background: #1a202c; color: #e2e8f0; padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .md-body code { font-family: Consolas, Monaco, monospace; }
  .md-body :not(pre) > code { background: #edf2f7; padding: 1px 5px; border-radius: 4px; color: #c53030; }
  .md-body h1, .md-body h2, .md-body h3 { margin: 10px 0 6px; }
  .md-body ul, .md-body ol { padding-left: 22px; margin: 6px 0; }
  @media (max-width: 600px) {
    body { margin: 16px auto; padding: 0 12px; }
    .card { padding: 12px 14px; }
    input[type=text] { font-size: 16px; }
    h1 { font-size: 20px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<h1>📚 个人 AI 知识库</h1>
<p class="sub">本地中文向量模型 · 智谱 GLM-4-flash · RAG 问答</p>

<div class="card">
  <label>① 上传资料</label>
  <div class="row">
    <input type="file" id="fileInput" multiple accept=".md,.txt,.pdf,.docx">
    <button onclick="uploadFiles()">上传并重建知识库</button>
  </div>
  <div class="file-list" id="fileList">加载中...</div>
</div>

<div class="card">
  <label>② 提问</label>
  <div class="row">
    <input type="text" id="question" placeholder="例如:RAG 是什么?chunk 切太大有什么问题?" onkeydown="if(event.key==='Enter') askQuestion()">
    <button id="askBtn" onclick="askQuestion()">问 AI</button>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="row" style="justify-content: space-between; margin-top: 0;">
    <label>对话记录</label>
    <span id="fbStat" class="fb-stat"></span>
    <button class="del-btn" onclick="clearChat()">清空对话</button>
  </div>
  <div id="chat"></div>
</div>

<div class="toast" id="toast"></div>

<script>
async function loadDocs() {
  const r = await fetch('/docs');
  const d = await r.json();
  const el = document.getElementById('fileList');
  if (!d.files.length) {
    el.innerHTML = '<span class="empty">暂无文档 — 上传几个试试,支持 .md / .txt / .pdf</span>';
    return;
  }
  const head = document.createElement('div');
  head.innerHTML = '当前资料:<b>' + d.files.length + '</b> 个文件,共 <b>' + d.chunks + '</b> 个片段';
  el.innerHTML = '';
  el.appendChild(head);
  for (const f of d.files) {
    const line = document.createElement('div');
    line.style.marginTop = '4px';
    const name = document.createElement('span');
    name.textContent = '· ' + f;
    const btn = document.createElement('button');
    btn.className = 'del-btn';
    btn.textContent = '删除';
    btn.onclick = () => deleteDoc(f);
    line.appendChild(name);
    line.appendChild(btn);
    el.appendChild(line);
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

async function deleteDoc(fname) {
  if (!confirm('确定删除「' + fname + '」?该文档将从知识库中移除。')) return;
  const r = await fetch('/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({filename: fname})
  });
  const d = await r.json();
  if (d.ok) {
    toast('已删除 ' + d.deleted + ' · 剩余 ' + d.chunks + ' 个片段');
    loadDocs();
  } else {
    toast('失败: ' + (d.error || '未知错误'));
  }
}

async function uploadFiles() {
  const fi = document.getElementById('fileInput');
  if (!fi.files.length) { toast('请先选文件'); return; }
  const fd = new FormData();
  for (const f of fi.files) fd.append('files', f);
  toast('正在重建知识库...');
  const r = await fetch('/upload', { method: 'POST', body: fd });
  const d = await r.json();
  if (d.ok) {
    toast('已入库 ' + d.chunks + ' 个片段');
    fi.value = '';
    loadDocs();
  } else {
    toast('失败: ' + (d.error || '未知错误'));
  }
}

let chatHistory = [];  // 多轮对话记忆: [{q, a, sources}]

function renderChat() {
  const box = document.getElementById('chat');
  box.innerHTML = '';
  for (const h of chatHistory) {
    const msg = document.createElement('div');
    msg.className = 'msg';
    const q = document.createElement('div');
    q.className = 'q-bubble';
    q.textContent = '🙋 ' + h.q;
    const a = document.createElement('div');
    a.className = 'a-bubble answer md-body';
    if (window.marked) {
      try { a.innerHTML = marked.parse(h.a || ''); } catch (e) { a.textContent = h.a; }
      if (window.hljs) { a.querySelectorAll('pre code').forEach(b => { try { hljs.highlightElement(b); } catch (e) {} }); }
    } else {
      a.textContent = h.a;
    }
    msg.appendChild(q);
    msg.appendChild(a);
    // 操作行:复制 + 反馈(每条独立, 避免误标)
    const fb = document.createElement('div');
    fb.className = 'fb-row';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn'; copyBtn.textContent = '📋 复制';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(h.a).then(
        () => { copyBtn.textContent = '✅ 已复制'; setTimeout(() => copyBtn.textContent = '📋 复制', 1500); },
        () => { copyBtn.textContent = '复制失败'; }
      );
    };
    const up = document.createElement('button');
    up.className = 'fb-btn'; up.textContent = '👍 有帮助';
    const down = document.createElement('button');
    down.className = 'fb-btn'; down.textContent = '👎 答非所问';
    up.onclick = () => sendFeedback(h, 'up', up, down);
    down.onclick = () => sendFeedback(h, 'down', up, down);
    fb.appendChild(copyBtn); fb.appendChild(up); fb.appendChild(down);
    msg.appendChild(fb);
    const srcs = h.sources || [];
    if (srcs.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = '📎 参考资料:<br>' +
        srcs.map(x => '<div class="src-item"><b>' + x.source + '#' + x.chunk + '</b>: ' + x.preview + '...</div>').join('');
      msg.appendChild(s);
    }
    box.appendChild(msg);
  }
  box.scrollTop = box.scrollHeight;
}

function clearChat() {
  chatHistory = [];
  document.getElementById('chat').innerHTML = '';
  document.getElementById('resultCard').style.display = 'none';
}

async function sendFeedback(h, rating, upBtn, downBtn) {
  const r = await fetch('/feedback', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rating: rating, question: h.q, answer: h.a, sources: h.sources || []})
  });
  const d = await r.json();
  if (!d.ok) { toast('反馈失败: ' + (d.error || '')); return; }
  if (rating === 'up') { upBtn.textContent = '✅ 已赞'; } else { downBtn.textContent = '✅ 已踩'; }
  downBtn.disabled = upBtn.disabled = true;
  document.getElementById('fbStat').textContent =
    '💡 累计反馈 ' + d.total + ' 条（👍' + d.positive + ' / 👎' + d.negative + '）';
}

async function refreshFbStat() {
  try {
    const r = await fetch('/feedback/stats');
    const d = await r.json();
    if (d.ok && d.total) {
      document.getElementById('fbStat').textContent =
        '💡 累计反馈 ' + d.total + ' 条（👍' + d.positive + ' / 👎' + d.negative + '）';
    }
  } catch (e) {}
}

async function askQuestion() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;
  const btn = document.getElementById('askBtn');
  btn.disabled = true; btn.textContent = '思考中...';
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history: chatHistory})
    });
    const d = await r.json();
    if (!d.ok) { alert(d.error || '出错了'); return; }
    document.getElementById('resultCard').style.display = 'block';
    chatHistory.push({q: q, a: d.answer, sources: d.sources || []});
    document.getElementById('question').value = '';
    renderChat();
  } finally {
    btn.disabled = false; btn.textContent = '问 AI';
  }
}

loadDocs();
refreshFbStat();
</script>

</body>
</html>
